name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Test
        run: scripts/test.sh

      - name: Build app bundle
        run: scripts/build-app.sh --universal

      - uses: actions/upload-artifact@v4
        with:
          name: LunchBar-${{ github.sha }}
          path: dist/*.zip
          retention-days: 7
