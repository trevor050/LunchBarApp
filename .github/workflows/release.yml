name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test
        run: scripts/test.sh

      - name: Build universal app
        run: scripts/build-app.sh --universal --version "${GITHUB_REF_NAME#v}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          Download the zip, unzip it, and move **LunchBar.app** to Applications.

          LunchBar is not signed with an Apple Developer ID or notarized, so the first time you open it macOS will say it can't verify the app. To allow it: open **System Settings → Privacy & Security**, scroll down, and click **Open Anyway** next to the LunchBar message. You can also build it yourself from source; see the README.
          NOTES
          gh release create "${GITHUB_REF_NAME}" dist/*.zip \
            --title "LunchBar ${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            --verify-tag
